<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #222;">
    <p>Xin chao {{ recipient.get_full_name|default:recipient.username }},</p>
    <p>
      {{ sender.get_full_name|default:sender.username }} vua gui ban mot tin nhan moi trong cuoc
      tro chuyen ve "{{ conversation.listing.title }}".
    </p>
    <blockquote style="border-left: 3px solid #0366d6; margin: 16px 0; padding-left: 12px; color: #555;">
      {{ preview }}
    </blockquote>
    <p>
      <a href="{{ conversation_url }}" style="background: #0366d6; color: #fff; padding: 8px 12px; text-decoration: none; border-radius: 4px;">Mo hop thoai</a>
    </p>
    <p style="color: #888; font-size: 12px;">Day la email tu dong, vui long khong tra loi.</p>
  </body>
  </html>
